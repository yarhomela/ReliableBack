global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'reliableback-api'
    static_configs:
      - targets: [ 'host.docker.internal:5185' ]
    metrics_path: '/metrics'

  - job_name: 'reliableback-worker'
    static_configs:
      - targets: [ 'host.docker.internal:9090' ]
    metrics_path: '/metrics'