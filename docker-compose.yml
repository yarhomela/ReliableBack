services:
  postgres:
    image: postgres:16
    container_name: reliableback_postgres
    environment:
      POSTGRES_DB: reliableback
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: reliableback_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP протокол
      - "15672:15672"  # Management UI

  redis:
    image: redis:7
    container_name: reliableback_redis
    ports:
      - "6379:6379"
        
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: reliableback_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "6831:6831/udp" # Jaeger Thrift UDP

volumes:
  postgres_data: