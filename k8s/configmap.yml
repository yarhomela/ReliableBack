apiVersion: v1
kind: ConfigMap
metadata:
  name: reliableback-config
  namespace: reliableback
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ConnectionStrings__PostgreSQL: >-
    Host=postgres-service;Port=5432;
    Database=reliableback;Username=postgres;Password=postgres
  RabbitMQ__Host:     "rabbitmq-service"
  RabbitMQ__Port:     "5672"
  RabbitMQ__Username: "guest"
  RabbitMQ__Password: "guest"
  Redis__ConnectionString: "redis-service:6379"
  Jaeger__Host: "jaeger-service"
  Jaeger__Port: "6831"
  Worker__MaxConcurrentTasks:     "5"
  Worker__StalledThresholdMinutes: "10"
  Worker__CheckIntervalSeconds:   "30"
  Worker__BaseRetryDelaySeconds:  "30"