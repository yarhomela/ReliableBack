name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  checks: write
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'ReliableBack.sln'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Сервіси для integration тестів
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB:       reliableback_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Кешуємо NuGet пакети — прискорює pipeline з 3хв до ~45с
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }}
          --no-restore
          --configuration Release

      - name: Run unit tests
        run: dotnet test ${{ env.SOLUTION_PATH }}
          --no-build
          --configuration Release
          --filter "Category=Unit"
          --verbosity normal
          --logger "trx;LogFileName=unit-test-results.xml"

      - name: Run integration tests
        run: dotnet test ${{ env.SOLUTION_PATH }}
          --no-build
          --configuration Release
          --filter "Category=Integration"
          --verbosity normal
          --logger "trx;LogFileName=integration-test-results.xml"
        env:
          ConnectionStrings__PostgreSQL: >-
            Host=localhost;Port=5432;
            Database=reliableback_test;
            Username=postgres;Password=postgres
          RabbitMQ__Host:     localhost
          RabbitMQ__Port:     5672
          RabbitMQ__Username: guest
          RabbitMQ__Password: guest
          Redis__ConnectionString: localhost:6379

      # Публікуємо результати тестів в GitHub UI
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name:              Test Results
          path:              '**/*test-results.xml'
          reporter:          dotnet-trx
          fail-on-error:     true

      # Завантажуємо артефакти для дебагу якщо щось впало
      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: '**/*test-results.xml'

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # Перевіряємо форматування коду
      - name: Check code format
        run: dotnet format ${{ env.SOLUTION_PATH }}
          --verify-no-changes
          --severity warn